name: ui

on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Dependency audit for the runtime dependency tree (PR #321 review s2). Blocks on
      # critical advisories; lower severities are printed in the log for triage.
      # Gate is `critical`, not `high`, because main already carries a known high advisory
      # (image-size, transitive); tighten to `high` once that is resolved.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
